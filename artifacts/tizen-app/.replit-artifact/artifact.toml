kind = "web"
previewPath = "/tizen/"
title = "MaxPlayer Tizen TV App"
version = "1.0.0"
id = "artifacts/tizen-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/tizen/" ]
localPort = 5000

[services.development]
run = "pnpm --filter @workspace/tizen-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tizen-app", "run", "build" ]
publicDir = "artifacts/tizen-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5000"
BASE_PATH = "/tizen/"
