kind = "mobile"
previewPath = "/mobile/"
title = "MaxPlayer TV App"
version = "1.0.0"
id = "artifacts/maxplayer-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 20498

[services.development]
run = "pnpm --filter @workspace/maxplayer-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/maxplayer-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/maxplayer-app", "run", "serve" ]

[services.env]
PORT = "20498"
BASE_PATH = "/mobile/"
